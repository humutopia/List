<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 优化 viewport，禁止输入时自动缩放页面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIST — 创作计划清单</title>

    <!-- PWA & Web App Standalone Support -->
    <meta name="application-name" content="LIST">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LIST">
    <meta name="theme-color" content="#0b0b0b" id="meta-theme-color">

    <!-- App Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024' width='512' height='512'><rect width='1024' height='1024' rx='220' fill='%230b0b0b'/><g transform='translate(64, 64) scale(0.875)'><path d='M263.7906378 739.26406548l9.51835315-211.11219104L563.98485165 113.00524213l200.86165689 140.57875378-291.16398135 416.12287366-209.89188939 69.55719591z m69.80125626-190.85518313l-4.88120672 104.94594469 106.41030668-35.38874878 244.79251747-349.49440182-100.79691896-70.77749757-245.52469847 350.71470348z' fill='%23d4b886'/><path d='M373.6666013 551.29611613l205.0668165-285.40903863 33.69497004 24.21078533-205.06925709 285.40903867zM89.77561793 764.64634045h729.74040602v61.0150841H89.77561793z' fill='%23d4b886'/></g></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024' width='512' height='512'><rect width='1024' height='1024' rx='220' fill='%230b0b0b'/><g transform='translate(64, 64) scale(0.875)'><path d='M263.7906378 739.26406548l9.51835315-211.11219104L563.98485165 113.00524213l200.86165689 140.57875378-291.16398135 416.12287366-209.89188939 69.55719591z m69.80125626-190.85518313l-4.88120672 104.94594469 106.41030668-35.38874878 244.79251747-349.49440182-100.79691896-70.77749757-245.52469847 350.71470348z' fill='%23d4b886'/><path d='M373.6666013 551.29611613l205.0668165-285.40903863 33.69497004 24.21078533-205.06925709 285.40903867zM89.77561793 764.64634045h729.74040602v61.0150841H89.77561793z' fill='%23d4b886'/></g></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,300&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Newsreader', 'Noto Serif SC', serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 欺骗 iOS 的 16px 标准，同时通过 scale 还原精致的小字号与原有比例 */
        input[type="text"],
        input[type="password"],
        input[type="date"],
        textarea {
            font-size: 16px !important;
            transform: scale(0.75);
            transform-origin: left top;
            width: 133.33% !important;
            margin-bottom: -0.5rem;
        }

        .minimal-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-color);
            background-color: transparent !important;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            outline: none;
            flex-shrink: 0;
        }
        .minimal-checkbox:checked {
            background-color: transparent !important;
            border-color: var(--border-color);
        }
        .minimal-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 4px;
            width: 5px;
            height: 9px;
            border: solid var(--check-color);
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(45deg);
        }

        .completed-row {
            opacity: 0.4;
            text-decoration: line-through;
            color: var(--completed-color) !important;
        }
        .completed-row .minimal-checkbox {
            border-color: var(--completed-color) !important;
        }
        .completed-row .minimal-checkbox:checked::after {
            border-color: var(--completed-color) !important;
        }

        .editable-row {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .editable-row:hover {
            background-color: var(--row-hover-color);
        }

        .row-delete-btn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .row-revealed .row-delete-btn {
            opacity: 0.7;
            pointer-events: auto;
        }
        .row-revealed .row-delete-btn:hover {
            opacity: 1;
        }

        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-color);
            border-radius: 2px;
        }

        @media (max-width: 1023px) {
            table, tbody { 
                display: block; 
                width: 100%; 
            }
            thead { 
                display: none; 
            }
            #task-table-body {
                display: block;
                width: 100%;
            }
            #task-table-body tr {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px 12px;
                width: 100%;
                border: 1px solid var(--sub-divider-color, #262626);
                margin-bottom: 14px;
                padding: 14px 12px;
                border-radius: 2px;
                box-sizing: border-box;
            }
            #task-table-body td {
                display: block;
                width: 100%;
                padding: 0 !important;
                white-space: normal !important;
                box-sizing: border-box;
                word-break: break-word;
            }
            
            #task-table-body td.status-cell {
                grid-column: 1 / -1; 
                grid-row: 1;
                display: flex;
                align-items: center;
                border-bottom: 1px dashed var(--sub-divider-color, #262626);
                padding-bottom: 12px !important;
                margin-bottom: 4px;
            }
            #task-table-body td.status-cell::before {
                display: none;
            }
            
            #task-table-body td[data-label]:not(.status-cell)::before {
                content: attr(data-label);
                display: block;
                font-size: 9px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                opacity: 0.55;
                margin-bottom: 4px;
                font-family: monospace;
            }
        }
    </style>
</head>

<body id="app-body" class="min-h-screen flex flex-col antialiased bg-[#0b0b0b] text-[#d4b886] selection:bg-[#d4b886] selection:text-[#0b0b0b]">

    <header class="w-full max-w-6xl mx-auto px-4 sm:px-8 pt-8 sm:pt-16 pb-8 sm:pb-12 flex flex-row justify-between items-end border-b border-[var(--divider-color)] gap-3 sm:gap-6">
        <div>
            <p id="title-label" class="text-[10px] sm:text-[11px] tracking-[0.2em] sm:tracking-[0.25em] uppercase text-[#d4b886] mb-2 sm:mb-3" style="font-family: 'Times New Roman', Times, serif; font-weight: bold;">CREATION PLAN CHECKLIST</p>
            <h1 id="main-title" class="text-2xl sm:text-3xl md:text-4xl text-[#d4b886]" style="font-family: 'SimSun', 'STSong', 'Songti SC', 'Noto Serif SC', serif; font-weight: bold; text-align: justify; text-align-last: justify; -moz-text-align-last: justify;">创作计划清单</h1>
        </div>
        <div class="flex flex-col items-end justify-end space-y-2 shrink-0">
            <button onclick="toggleTheme()" id="theme-toggle-btn" class="p-1 text-[#d4b886] opacity-70 hover:opacity-100 transition-opacity bg-transparent border-none outline-none cursor-pointer flex items-center justify-center" aria-label="切换模式">
                <svg id="theme-icon" class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"></svg>
            </button>
            <span id="current-date-display" class="text-xs text-[#d4b886] font-mono tracking-wider inline-block text-right"></span>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-8 py-8 sm:py-12">
        
        <!-- Table Container -->
        <div class="w-full overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-[var(--divider-color)] text-[10px] uppercase tracking-[0.2em] text-[#d4b886] font-mono">
                        <th class="py-3 px-3 sm:px-6 font-normal w-24 sm:w-32">日期</th>
                        <th class="py-3 px-3 sm:px-6 font-normal w-40 sm:w-56">主题</th>
                        <th class="py-3 px-3 sm:px-6 font-normal w-40 sm:w-56">配乐</th>
                        <th class="py-3 px-3 sm:px-6 font-normal">文案</th>
                        <th class="py-3 px-2 sm:px-4 font-normal w-20 sm:w-24 text-right">状态</th>
                    </tr>
                </thead>
                <tbody id="task-table-body" class="divide-y divide-[var(--sub-divider-color)] text-xs">
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden py-32 text-center">
            <p class="text-sm text-[#d4b886] tracking-wide mb-1">暂无相关条目</p>
            <p class="text-[11px] text-[#d4b886] opacity-60 font-mono">点击右下角 + 新计划开始记录</p>
        </div>

    </main>

    <footer class="py-8 sm:py-12 px-4 sm:px-8 max-w-6xl mx-auto w-full border-t border-[var(--divider-color)] text-left text-[11px] text-[var(--text-color)] tracking-[0.2em] font-mono opacity-80">
        <p>©️ 2026 Z_Z</p>
    </footer>

    <!-- Add Plan Button (+ 新计划) -->
    <div class="fixed bottom-6 sm:bottom-8 inset-x-0 z-40 pointer-events-none">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 flex justify-end">
            <button onclick="openModal()" class="pointer-events-auto mr-2 sm:mr-3 px-4 sm:px-5 py-2.5 sm:py-3 bg-[#d4b886] text-[#0b0b0b] text-xs sm:text-sm tracking-[0.15em] uppercase hover:opacity-90 transition-opacity duration-150 font-mono font-normal shadow-lg whitespace-nowrap">
                + 新计划
            </button>
        </div>
    </div>

    <!-- Modal Form (新增/编辑) -->
    <div id="task-modal" class="fixed inset-0 bg-[#000000]/60 backdrop-blur-[2px] z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-content" class="bg-[#141414] text-[#d4b886] max-w-md w-full p-5 sm:p-8 border border-[#2a2a2a] shadow-2xl fade-in max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-[#262626]">
                <h3 id="modal-title" class="text-sm tracking-widest uppercase font-mono text-[#d4b886]">新增创作计划</h3>
                <button onclick="closeModal()" class="text-[#d4b886] hover:opacity-100 opacity-70 transition-opacity">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="task-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="task-id">
                <div class="overflow-hidden">
                    <label class="block text-[10px] uppercase tracking-[0.15em] text-[#d4b886] mb-1.5 font-mono">日期</label>
                    <input type="date" id="task-date" required class="bg-[#1b1b1b] text-[#d4b886] border border-[#2f2f2f] rounded-none px-3 py-2 font-mono focus:outline-none focus:border-[#d4b886]">
                </div>
                <div class="overflow-hidden">
                    <label class="block text-[10px] uppercase tracking-[0.15em] text-[#d4b886] mb-1.5 font-mono">主题</label>
                    <input type="text" id="task-theme" placeholder="例如：现代主义建筑与光影" required class="bg-[#1b1b1b] text-[#d4b886] border border-[#2f2f2f] rounded-none px-3 py-2 placeholder-[#666666] focus:outline-none focus:border-[#d4b886]">
                </div>
                <div class="overflow-hidden">
                    <label class="block text-[10px] uppercase tracking-[0.15em] text-[#d4b886] mb-1.5 font-mono">配乐</label>
                    <input type="text" id="task-bgm" placeholder="例如：Max Richter - On the Nature of Daylight" required class="bg-[#1b1b1b] text-[#d4b886] border border-[#2f2f2f] rounded-none px-3 py-2 placeholder-[#666666] focus:outline-none focus:border-[#d4b886]">
                </div>
                <div class="overflow-hidden">
                    <label class="block text-[10px] uppercase tracking-[0.15em] text-[#d4b886] mb-1.5 font-mono">文案</label>
                    <textarea id="task-copywriting" rows="3" placeholder="写下一段简短的灵感草稿..." required class="bg-[#1b1b1b] text-[#d4b886] border border-[#2f2f2f] rounded-none px-3 py-2 placeholder-[#666666] focus:outline-none focus:border-[#d4b886] resize-none"></textarea>
                </div>
                <div class="overflow-hidden">
                    <label class="block text-[10px] uppercase tracking-[0.15em] text-[#d4b886] mb-1.5 font-mono">操作口令</label>
                    <input type="password" id="task-secret" placeholder="请输入操作口令" required class="bg-[#1b1b1b] text-[#d4b886] border border-[#2f2f2f] rounded-none px-3 py-2 placeholder-[#666666] focus:outline-none focus:border-[#d4b886]">
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-[#2a2a2a] text-xs text-[#d4b886] hover:border-[#d4b886] transition-colors font-mono">取消</button>
                    <button type="submit" class="px-5 py-2 bg-[#d4b886] text-[#0b0b0b] text-xs hover:opacity-95 transition-opacity font-mono font-medium">确认保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal (删除确认) -->
    <div id="confirm-modal" class="fixed inset-0 bg-[#000000]/60 backdrop-blur-[2px] z-50 flex items-center justify-center p-4 hidden">
        <div id="confirm-content" class="bg-[#141414] text-[#d4b886] max-w-xs w-full p-6 border border-[#2a2a2a] shadow-2xl fade-in text-center">
            <h4 class="text-xs uppercase tracking-widest font-mono text-[#d4b886] mb-2">删除确认</h4>
            <p class="text-xs text-[#d4b886] mb-4 font-serif opacity-85">确定要移除这条创作计划吗？</p>
            <div class="mb-4 text-left overflow-hidden">
                <input type="password" id="delete-secret" placeholder="请输入操作口令" class="bg-[#1b1b1b] text-[#d4b886] border border-[#2f2f2f] rounded-none px-3 py-1.5 placeholder-[#666666] focus:outline-none focus:border-[#d4b886]">
            </div>
            <div class="flex justify-center space-x-3">
                <button onclick="closeConfirmModal()" class="px-4 py-1.5 border border-[#2a2a2a] text-xs text-[#d4b886] hover:border-[#d4b886] font-mono">取消</button>
                <button id="confirm-yes-btn" class="px-4 py-1.5 bg-[#d4b886] text-[#0b0b0b] text-xs hover:opacity-95 font-mono font-medium">确认删除</button>
            </div>
        </div>
    </div>

    <!-- Toggle Status Modal (状态切换验证弹窗) -->
    <div id="toggle-modal" class="fixed inset-0 bg-[#000000]/60 backdrop-blur-[2px] z-50 flex items-center justify-center p-4 hidden">
        <div id="toggle-content" class="bg-[#141414] text-[#d4b886] max-w-xs w-full p-6 border border-[#2a2a2a] shadow-2xl fade-in text-center">
            <h4 class="text-xs uppercase tracking-widest font-mono text-[#d4b886] mb-2">状态更新</h4>
            <p class="text-xs text-[#d4b886] mb-4 font-serif opacity-85">请输入口令以变更状态</p>
            <div class="mb-4 text-left overflow-hidden">
                <input type="password" id="toggle-secret" placeholder="请输入操作口令" class="bg-[#1b1b1b] text-[#d4b886] border border-[#2f2f2f] rounded-none px-3 py-1.5 placeholder-[#666666] focus:outline-none focus:border-[#d4b886]">
            </div>
            <div class="flex justify-center space-x-3">
                <button onclick="closeToggleModal()" class="px-4 py-1.5 border border-[#2a2a2a] text-xs text-[#d4b886] hover:border-[#d4b886] font-mono">取消</button>
                <button id="toggle-yes-btn" class="px-4 py-1.5 bg-[#d4b886] text-[#0b0b0b] text-xs hover:opacity-95 font-mono font-medium font-bold">确认更新</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 sm:left-auto sm:right-8 sm:translate-x-0 bg-[#d4b886] text-[#0b0b0b] px-4 py-2.5 text-[11px] font-mono tracking-wider opacity-0 transition-opacity duration-200 pointer-events-none z-50 font-medium whitespace-nowrap"></div>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            deleteDoc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdut-ehczuJVlP95RyIAGW1CTLVq4Ei4k",
            authDomain: "conplan.firebaseapp.com",
            projectId: "conplan",
            storageBucket: "conplan.firebasestorage.app",
            messagingSenderId: "750282375913",
            appId: "1:750282375913:web:8dde381098c55921432678"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksCollection = collection(db, "tasks");

        let tasks = [];
        let deleteTargetId = null;
        let toggleTargetId = null;
        let revealedTaskId = null;
        let currentTheme = localStorage.getItem('minimal_editorial_theme') || 'dark';

        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(currentTheme);
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' };
            document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('zh-CN', options);
            document.getElementById('task-date').value = new Date().toISOString().split('T')[0];
            alignTitleWidth();

            onSnapshot(tasksCollection, (snapshot) => {
                tasks = snapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));
                renderTasks();
            }, (error) => {
                console.error("Firebase sync error:", error);
                showToast('数据同步失败，请检查网络');
            });
        });

        function alignTitleWidth() {
            const label = document.getElementById('title-label');
            const title = document.getElementById('main-title');
            if (label && title) {
                title.style.width = label.getBoundingClientRect().width + 'px';
            }
        }
        window.addEventListener('resize', alignTitleWidth);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(alignTitleWidth);
        }

        document.addEventListener('click', () => {
            if (revealedTaskId) {
                revealedTaskId = null;
                renderTasks();
            }
        });

        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('minimal_editorial_theme', theme);
            const body = document.getElementById('app-body');
            const themeIcon = document.getElementById('theme-icon');
            const modalContent = document.getElementById('modal-content');
            const confirmContent = document.getElementById('confirm-content');
            const toggleContent = document.getElementById('toggle-content');
            
            const formInputs = document.querySelectorAll('#task-form input:not([type="hidden"]), #task-form textarea, #delete-secret, #toggle-secret');
            const metaTheme = document.getElementById('meta-theme-color');

            if (theme === 'light') {
                if (metaTheme) metaTheme.setAttribute('content', '#fbfbf9');
                body.style.setProperty('--bg-color', '#fbfbf9');
                body.style.setProperty('--text-color', '#2c2825');
                body.style.setProperty('--border-color', '#2c2825');
                body.style.setProperty('--check-color', '#2c2825');
                body.style.setProperty('--completed-color', '#948c85');
                body.style.setProperty('--divider-color', '#e5e2db');
                body.style.setProperty('--sub-divider-color', '#e8e2d5');
                body.style.setProperty('--scrollbar-color', '#d5d0c7');
                body.style.setProperty('--row-hover-color', 'rgba(0,0,0,0.025)');

                body.style.backgroundColor = '#fbfbf9';
                body.style.color = '#2c2825';
                
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>';

                if (modalContent) {
                    modalContent.style.backgroundColor = '#f4f2ec';
                    modalContent.style.color = '#2c2825';
                    modalContent.style.borderColor = '#d5d0c7';
                }
                if (confirmContent) {
                    confirmContent.style.backgroundColor = '#f4f2ec';
                    confirmContent.style.color = '#2c2825';
                    confirmContent.style.borderColor = '#d5d0c7';
                }
                if (toggleContent) {
                    toggleContent.style.backgroundColor = '#f4f2ec';
                    toggleContent.style.color = '#2c2825';
                    toggleContent.style.borderColor = '#d5d0c7';
                }

                formInputs.forEach(input => {
                    input.style.backgroundColor = '#eae7df';
                    input.style.borderColor = '#d0cbc0';
                    input.style.color = '#2c2825';
                });
            } else {
                if (metaTheme) metaTheme.setAttribute('content', '#0b0b0b');
                body.style.setProperty('--bg-color', '#0b0b0b');
                body.style.setProperty('--text-color', '#d4b886');
                body.style.setProperty('--border-color', '#d4b886');
                body.style.setProperty('--check-color', '#d4b886');
                body.style.setProperty('--completed-color', '#8c7d62');
                body.style.setProperty('--divider-color', '#222222');
                body.style.setProperty('--sub-divider-color', '#262626');
                body.style.setProperty('--scrollbar-color', '#262626');
                body.style.setProperty('--row-hover-color', 'rgba(255,255,255,0.025)');

                body.style.backgroundColor = '#0b0b0b';
                body.style.color = '#d4b886';

                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path>';

                if (modalContent) {
                    modalContent.style.backgroundColor = '#141414';
                    modalContent.style.color = '#d4b886';
                    modalContent.style.borderColor = '#2a2a2a';
                }
                if (confirmContent) {
                    confirmContent.style.backgroundColor = '#141414';
                    confirmContent.style.color = '#d4b886';
                    confirmContent.style.borderColor = '#2a2a2a';
                }
                if (toggleContent) {
                    toggleContent.style.backgroundColor = '#141414';
                    toggleContent.style.color = '#d4b886';
                    toggleContent.style.borderColor = '#2a2a2a';
                }

                formInputs.forEach(input => {
                    input.style.backgroundColor = '#1b1b1b';
                    input.style.borderColor = '#2f2f2f';
                    input.style.color = '#d4b886';
                });
            }
        }

        window.toggleTheme = function() {
            if (currentTheme === 'dark') {
                applyTheme('light');
            } else {
                applyTheme('dark');
            }
        };

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function renderTasks() {
            const tbody = document.getElementById('task-table-body');
            const emptyState = document.getElementById('empty-state');

            let filtered = tasks;

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            filtered.sort((a, b) => {
                const dateDiff = new Date(b.date) - new Date(a.date);
                if (dateDiff !== 0) return dateDiff;
                return (b.id || 0) > (a.id || 0) ? 1 : -1;
            });

            tbody.innerHTML = filtered.map(task => `
                <tr class="group editable-row transition-colors ${task.completed ? 'completed-row' : ''} ${task.id === revealedTaskId ? 'row-revealed' : ''}" onclick="window.handleRowClick(event, '${task.id}')" ondblclick="window.handleRowDblClick(event, '${task.id}')" title="点击空白处可显示删除按钮，双击可编辑该条目">
                    <td class="py-4 px-3 sm:px-6 text-[11px] font-mono whitespace-nowrap" data-label="日期">
                        ${task.date}
                    </td>
                    <td class="py-4 px-3 sm:px-6 text-xs font-medium" data-label="主题">
                        ${escapeHTML(task.theme || '')}
                    </td>
                    <td class="py-4 px-3 sm:px-6 text-xs" data-label="配乐">
                        ${escapeHTML(task.bgm || '')}
                    </td>
                    <td class="py-4 px-3 sm:px-6 text-xs leading-relaxed max-w-sm" data-label="文案">
                        ${escapeHTML(task.copywriting || '')}
                    </td>
                    <td class="status-cell py-4 px-2 sm:px-4 whitespace-nowrap align-middle" data-label="状态">
                        <div class="flex items-center justify-between lg:justify-end w-full">
                            <div class="lg:hidden flex items-center text-current opacity-70">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="-rotate-45">
                                    <line x1="12" y1="17" x2="12" y2="22"></line>
                                    <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
                                </svg>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="event.stopPropagation(); window.promptDelete('${task.id}')" class="row-delete-btn transition-opacity p-1 text-[#d4b886]" title="点击删除条目">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                                <label class="inline-flex items-center cursor-pointer" onclick="event.stopPropagation()" title="点击切换完成状态">
                                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="window.promptToggle('${task.id}')" class="minimal-checkbox">
                                </label>
                            </div>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        window.handleRowClick = function(event, id) {
            if (event.target.closest('input') || event.target.closest('button') || event.target.closest('label')) {
                return;
            }
            event.stopPropagation();
            revealedTaskId = (revealedTaskId === id) ? null : id;
            renderTasks();
        };

        window.handleRowDblClick = function(event, id) {
            if (event.target.closest('input') || event.target.closest('button') || event.target.closest('label')) {
                return;
            }
            event.stopPropagation();
            revealedTaskId = null;
            window.openModal(id);
        };

        window.promptToggle = function(id) {
            toggleTargetId = id;
            const input = document.getElementById('toggle-secret');
            input.value = '';
            document.getElementById('toggle-modal').classList.remove('hidden');
        };

        window.closeToggleModal = function() {
            toggleTargetId = null;
            document.getElementById('toggle-modal').classList.add('hidden');
            renderTasks();
        };

        document.getElementById('toggle-yes-btn').addEventListener('click', async () => {
            const secretKey = document.getElementById('toggle-secret').value.trim();
            if (!secretKey) {
                showToast('请输入口令');
                return;
            }
            if (toggleTargetId) {
                const task = tasks.find(t => t.id === toggleTargetId);
                if (task) {
                    try {
                        await setDoc(doc(db, "tasks", toggleTargetId), {
                            ...task,
                            completed: !task.completed,
                            secretKey: secretKey
                        }, { merge: true });
                        closeToggleModal();
                    } catch (error) {
                        console.error("Toggle task error:", error);
                        showToast('口令错误，更新失败');
                    }
                }
            }
        });

        window.openModal = function(editId = null) {
            const modal = document.getElementById('task-modal');
            const form = document.getElementById('task-form');
            form.reset();
            
            document.getElementById('task-secret').value = '';

            if (editId) {
                document.getElementById('modal-title').innerText = '编辑创作计划';
                const task = tasks.find(t => t.id === editId);
                if (task) {
                    document.getElementById('task-id').value = task.id;
                    document.getElementById('task-date').value = task.date;
                    document.getElementById('task-theme').value = task.theme;
                    document.getElementById('task-bgm').value = task.bgm;
                    document.getElementById('task-copywriting').value = task.copywriting;
                }
            } else {
                document.getElementById('modal-title').innerText = '新增创作计划';
                document.getElementById('task-id').value = '';
                document.getElementById('task-date').value = new Date().toISOString().split('T')[0];
            }

            modal.classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('task-modal').classList.add('hidden');
        };

        window.promptDelete = function(id) {
            deleteTargetId = id;
            document.getElementById('delete-secret').value = '';
            document.getElementById('confirm-modal').classList.remove('hidden');
        };

        window.closeConfirmModal = function() {
            deleteTargetId = null;
            document.getElementById('confirm-modal').classList.add('hidden');
        };

        document.getElementById('confirm-yes-btn').addEventListener('click', async () => {
            const secretKey = document.getElementById('delete-secret').value.trim();
            if (!secretKey) {
                showToast('请输入口令');
                return;
            }
            if (deleteTargetId) {
                try {
                    const taskRef = doc(db, "tasks", deleteTargetId);
                    await setDoc(taskRef, { secretKey: secretKey }, { merge: true });
                    await deleteDoc(taskRef);
                    
                    showToast('已成功删除条目');
                    closeConfirmModal();
                } catch (error) {
                    console.error("Delete task error:", error);
                    showToast('口令错误，删除失败');
                }
            }
        });

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const date = document.getElementById('task-date').value;
            const theme = document.getElementById('task-theme').value.trim();
            const bgm = document.getElementById('task-bgm').value.trim();
            const copywriting = document.getElementById('task-copywriting').value.trim();
            const secretKey = document.getElementById('task-secret').value.trim();

            if (!secretKey) {
                showToast('请输入操作口令');
                return;
            }

            const docId = id || Date.now().toString();
            const currentTask = tasks.find(t => t.id === id);
            
            const taskData = {
                date,
                theme,
                bgm,
                copywriting,
                completed: currentTask ? currentTask.completed : false,
                secretKey: secretKey
            };

            try {
                await setDoc(doc(db, "tasks", docId), taskData, { merge: true });
                showToast(id ? '已更新创作计划' : '已添加新创作计划');
                closeModal();
            } catch (error) {
                console.error("Save task error:", error);
                showToast('口令错误，保存失败');
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
